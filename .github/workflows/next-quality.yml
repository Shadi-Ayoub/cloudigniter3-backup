name: Next package quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Next tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm quality:next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-test-results-node-${{ matrix.node }}
          path: packages/next/coverage/
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: Next build and publish request
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm release:check:next
      - uses: actions/upload-artifact@v4
        with:
          name: next-release-candidate-${{ github.sha }}
          path: packages/next/coverage/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish request summary
        run: cat packages/next/coverage/release/publish-request.md >> "$GITHUB_STEP_SUMMARY"
