name: Platform packages quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Package ${{ matrix.package }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [aws, cli, config-ts, core, emberguard, ui]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate shared TypeScript presets
        if: matrix.package == 'config-ts'
        run: node scripts/ci/check-presets.mjs
      - name: Check package source and tools
        if: matrix.package != 'config-ts'
        run: pnpm --filter @cloudigniter/${{ matrix.package }} check
      - name: Run package behavioral tests
        if: matrix.package != 'config-ts' && matrix.package != 'cli'
        run: pnpm --filter @cloudigniter/${{ matrix.package }} test
      - name: Check package inventory
        if: matrix.package != 'config-ts'
        run: pnpm --filter @cloudigniter/${{ matrix.package }} check:package
      - name: Build production package
        if: matrix.node == 24 && matrix.package != 'cli' && matrix.package != 'config-ts'
        run: pnpm --filter @cloudigniter/${{ matrix.package }} build:prod
      - name: Pack reviewed candidate
        if: matrix.node == 24
        working-directory: packages/${{ matrix.package }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package-candidate"
      - name: Verify advertised archive entries
        if: matrix.node == 24
        run: node scripts/ci/check-archive.mjs "$RUNNER_TEMP/package-candidate"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: package-${{ matrix.package }}-${{ github.sha }}
          path: ${{ runner.temp }}/package-candidate/*.tgz
          if-no-files-found: error
          retention-days: 14
